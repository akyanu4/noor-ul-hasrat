<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Members · Noor-ul-Hasrat</title>
<meta name="theme-color" content="#0a2b2c">
<link rel="icon" href="icons/favicon-48.png">
<style>
  :root{--ink:#1a2421;--cream:#faf7f0;--panel:#fff;--teal:#0f3d3e;--gold:#c9a24b;--line:#e4ddc9;--muted:#6b7570;--good:#2f9e63;--mid:#d39b1e;--low:#d0564c}
  @media (prefers-color-scheme:dark){:root{--ink:#f2ede0;--cream:#0d1413;--panel:#132322;--teal:#8bd0c8;--gold:#d9b968;--line:#264443;--muted:#8fa19c}}
  *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 48px}
  a{color:var(--teal)}h1{font-size:22px;margin:4px 0 2px}.muted{color:var(--muted);font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--muted)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
  input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
  button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer}
  button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
  @media (prefers-color-scheme:dark){button.pri{color:#0d1413}}
  .list{display:flex;flex-direction:column;gap:8px}
  .m{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%}
  .m:hover{border-color:var(--gold)}.m .who{flex:1;min-width:0}.m .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.m .who span{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sc{width:52px;height:52px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;border:3px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
  .sc small{font-size:9px;font-weight:600;color:var(--muted)}.sc.g{border-color:var(--good)}.sc.y{border-color:var(--mid)}.sc.r{border-color:var(--low)}
  .det{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:14px;margin:4px 0 6px}
  .det h2{font-size:17px;margin:0 0 4px}.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:8px 0}.kv span{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center}th{color:var(--muted);font-weight:600;padding:4px 2px}td{padding:5px 2px;border-top:1px solid var(--line)}td:first-child,th:first-child{text-align:left}
  .scroll{overflow-x:auto}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
  code{background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:13px;word-break:break-all}
</style>
</head>
<body><div class="wrap">
<p><a href="./">← Back to Noor-ul-Hasrat</a></p>
<h1>Members</h1>
<div class="muted">Registered members and their Iman Health. Members agreed to share this with the admin when they signed up. Please keep it private.</div>
<div id="out"><div class="card">Loading…</div></div>
</div>
<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/iman.js"></script>
<script>
(function () {
  'use strict';
  var out = document.getElementById('out'), I = window.NoorIman;
  var store = null; try { store = localStorage; } catch (e) {}
  var B = NoorBackend.create(window.NOOR_CONFIG || {}, { fetch: window.fetch.bind(window), storage: store, crypto: window.crypto });
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ago(ms) { if (!ms) return 'never'; var d = Math.floor((Date.now() - ms) / 86400000); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; }
  function band(n) { return n >= 85 ? 'g' : n >= 40 ? 'y' : 'r'; }
  var members = [], open = '';

  var u = B.account.user();
  if (!u) { out.innerHTML = '<div class="card">Sign in first: open the app, go to <b>More → My Account</b>, sign in with your email, then come back to this page.</div>'; return; }
  B.admin.isAdmin().then(function (ok) {
    if (!ok) {
      out.innerHTML = '<div class="card"><b>' + esc(u.email) + ' is not an admin yet.</b><p>To make this account an admin, open the Firebase console → Realtime Database → Data. Add a key <code>admins</code>, and inside it a key with this account id and the value <code>true</code>:</p><p><code id="uid">' + esc(u.uid) + '</code> <button id="cp">Copy id</button></p><p class="muted">Only someone with access to the Firebase console can do this. Then reload this page.</p></div>';
      document.getElementById('cp').onclick = function () { try { navigator.clipboard.writeText(u.uid); this.textContent = 'Copied'; } catch (e) {} };
      return;
    }
    return Promise.all([B.admin.get('profiles'), B.admin.get('summaries'), B.admin.get('bayah_ok').catch(function () { return null; }), B.admin.get('bayah_req').catch(function () { return null; })]).then(function (r) {
      var P = r[0] || {}, S = r[1] || {}, OK = r[2] || {}, RQ = r[3] || {};
      members = Object.keys(P).map(function (id) { return { id: id, p: P[id] || {}, s: S[id] || null, ok: OK[id] || null, rq: RQ[id] || null }; })
        .sort(function (a, b) { return String(a.p.name || '').localeCompare(String(b.p.name || '')); });
      paint();
    });
  }).catch(function (e) { out.innerHTML = '<div class="card">Could not load members (' + esc(e && e.message) + '). Check your internet and the database rules, then reload.</div>'; });

  function bstat(m) { return !(m.p.bayah && m.p.bayah.taken) ? 'none' : m.ok && m.ok.approved ? 'approved' : m.ok && m.ok.rejected ? 'rejected' : 'pending'; }
  function decide(id, approve, btn) {
    var m = members.filter(function (x) { return x.id === id; })[0]; if (!m) return;
    if (!approve && !confirm('Mark the Bai\u2019at of ' + (m.p.name || 'this member') + ' as not approved? The full dars and dhikr practices stay closed for them.')) return;
    if (btn) btn.disabled = true;
    var v = approve ? { approved: true, with: (m.p.bayah && m.p.bayah.with) || '', by: u.email, at: Date.now() } : { rejected: true, by: u.email, at: Date.now() };
    B.admin.put('bayah_ok/' + id, v).then(function () { m.ok = v; paint(); }, function (e) { if (btn) btn.disabled = false; alert('Could not save (' + (e && e.message) + '). Check the database rules include "bayah_ok".'); });
  }
  // Requests to take Bai'at: the member writes profiles/<uid>/bayah_request; "Mark contacted" writes bayah_req/<uid>.
  function hasReq(m) { return !!(m.p.bayah_request && m.p.bayah_request.at) && !(m.p.bayah && m.p.bayah.taken); }
  function contacted(m) { return !!(m.rq && m.rq.contacted && (m.rq.at || 0) >= (m.p.bayah_request.at || 0)); }
  function markContacted(id, on, btn) {
    var m = members.filter(function (x) { return x.id === id; })[0]; if (!m) return;
    if (btn) btn.disabled = true;
    var v = on ? { contacted: true, by: u.email, at: Date.now() } : null;
    (on ? B.admin.put('bayah_req/' + id, v) : B.admin.del('bayah_req/' + id)).then(function () { m.rq = v; paint(); },
      function (e) { if (btn) btn.disabled = false; alert('Could not save (' + (e && e.message) + '). Check the database rules include "bayah_req".'); });
  }
  function fresh(m) { return m.s && m.s.updated && Date.now() - m.s.updated < 7 * 86400000; }
  function paint() {
    var q = (document.getElementById('q') || {}).value || '';
    var active = members.filter(fresh), avg = active.length ? Math.round(active.reduce(function (t, m) { return t + (m.s.score || 0); }, 0) / active.length) : 0;
    var pend = members.filter(function (m) { return bstat(m) === 'pending'; });
    var h = '<div class="stats"><div class="stat"><b>' + members.length + '</b><span>members</span></div>' +
      '<div class="stat"><b>' + members.filter(function (m) { return m.p.joined && Date.now() - m.p.joined < 30 * 86400000; }).length + '</b><span>joined in 30 days</span></div>' +
      '<div class="stat"><b>' + active.length + '</b><span>active this week</span></div>' +
      '<div class="stat"><b>' + (active.length ? avg : '–') + '</b><span>average Iman Health</span></div>' +
      '<div class="stat"><b>' + members.filter(function (m) { return bstat(m) === 'approved'; }).length + '</b><span>Bai\u2019at approved 🤝</span></div>' +
      '<div class="stat"><b>' + pend.length + '</b><span>waiting for approval ⏳</span></div>' +
      '<div class="stat"><b>' + members.filter(function (m) { return hasReq(m) && !contacted(m); }).length + '</b><span>Bai\u2019at requests 📨</span></div>' +
      '<div class="stat"><b>' + members.filter(function (m) { return m.p.remind && m.p.remind.gather; }).length + '</b><span>get gathering emails</span></div></div>';
    if (pend.length) h += '<div class="card" style="border-color:var(--gold)"><b>🤝 Waiting for Bai\u2019at approval (' + pend.length + ')</b>' + pend.map(function (m) {
      return '<div class="pend" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap"><div style="flex:1;min-width:180px"><b>' + esc(m.p.name || '') + '</b><div class="muted">With ' + esc((m.p.bayah && m.p.bayah.with) || '?') +
        (m.p.bayah && m.p.bayah.at ? ' · marked ' + esc(new Date(m.p.bayah.at).toLocaleDateString()) : '') + ' · ' + esc(m.p.email || '') + (m.p.phone ? ' · ' + esc(m.p.phone) : '') + '</div></div>' +
        '<button class="pri" data-ok="' + esc(m.id) + '">Approve</button><button data-no="' + esc(m.id) + '">Not approved</button></div>';
    }).join('') + '</div>';
    var reqs = members.filter(hasReq).sort(function (a, b) { return (contacted(a) - contacted(b)) || (b.p.bayah_request.at - a.p.bayah_request.at); }), waitN = reqs.filter(function (m) { return !contacted(m); }).length;
    if (reqs.length) h += '<div class="card" style="border-color:var(--gold)"><b>🤝 Bai\u2019at requests (' + waitN + ')</b>' + (reqs.length > waitN ? ' <span class="muted">· ' + (reqs.length - waitN) + ' contacted</span>' : '') + reqs.map(function (m) {
      var q = m.p.bayah_request, c = contacted(m), ph = q.phone || m.p.phone || '';
      return '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap' + (c ? ';opacity:.65' : '') + '"><div style="flex:1;min-width:200px"><b>' + esc(m.p.name || '') + '</b>' + (m.p.city ? ' <span class="muted">· ' + esc(m.p.city) + '</span>' : '') +
        '<div class="muted">With ' + esc(q.with === 'Any' || !q.with ? 'any / whoever you suggest' : q.with) + ' · ' + esc(new Date(q.at).toLocaleDateString()) + (q.edited ? ' (edited)' : '') + '</div>' +
        '<div class="muted">' + (ph ? '<a href="tel:' + esc(ph.replace(/\s/g, '')) + '">' + esc(ph) + '</a> · ' : '') + '<a href="mailto:' + esc(m.p.email || '') + '">' + esc(m.p.email || '') + '</a></div>' +
        (q.note ? '<div style="font-size:13.5px;margin-top:4px">“' + esc(q.note) + '”</div>' : '') +
        (c ? '<div class="muted" style="margin-top:2px">Contacted ✓ ' + esc(m.rq.by || '') + ', ' + esc(new Date(m.rq.at).toLocaleDateString()) + '</div>' : '') + '</div>' +
        (c ? '<button data-unc="' + esc(m.id) + '">Undo</button>' : '<button class="pri" data-con="' + esc(m.id) + '">Mark contacted</button>') + '</div>';
    }).join('') + '</div>';
    h += '<div class="bar"><input type="search" id="q" placeholder="Search name, email, city" value="' + esc(q) + '"><button id="csv">Download CSV</button></div><div class="list">';
    var ql = q.toLowerCase();
    members.filter(function (m) { return !ql || [m.p.name, m.p.email, m.p.city, m.p.phone].join(' ').toLowerCase().indexOf(ql) !== -1; }).forEach(function (m) {
      var sc = fresh(m) ? m.s.score : null;
      h += '<button class="m" data-id="' + esc(m.id) + '"><div class="sc ' + (sc == null ? '' : band(sc)) + '">' + (sc == null ? '–' : sc) + '<small>' + (sc == null ? 'no data' : 'of 100') + '</small></div>' +
        '<div class="who"><b>' + esc(m.p.name || '(no name yet)') + ({ approved: ' 🤝', pending: ' ⏳', rejected: ' ✕', none: '' }[bstat(m)]) + '</b><span>' + esc([m.p.city, m.p.email].filter(Boolean).join(' · ')) + '</span><span>' + (m.s ? esc(m.s.label || '') + ' · updated ' + ago(m.s.updated) : 'Has not used Iman Health yet') + '</span></div></button>';
      if (open === m.id) h += '<div class="det" id="det">Loading…</div>';
    });
    if (!members.length) h += '<div class="card">No members yet. Share the app and ask people to tap More → My Account.</div>';
    h += '</div>';
    out.innerHTML = h;
    var qi = document.getElementById('q'); qi.oninput = function () { var pos = qi.selectionStart; paint(); var n = document.getElementById('q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} };
    document.getElementById('csv').onclick = csv;
    if (open) detail(open);
  }

  out.addEventListener('click', function (e) {
    var ok = e.target.closest && e.target.closest('[data-ok]'), no = e.target.closest && e.target.closest('[data-no]');
    if (ok) { decide(ok.getAttribute('data-ok'), true, ok); return; }
    if (no) { decide(no.getAttribute('data-no'), false, no); return; }
    var con = e.target.closest && e.target.closest('[data-con]'), unc = e.target.closest && e.target.closest('[data-unc]');
    if (con) { markContacted(con.getAttribute('data-con'), true, con); return; }
    if (unc) { markContacted(unc.getAttribute('data-unc'), false, unc); return; }
    var b = e.target.closest && e.target.closest('.m'); if (!b) return;
    var id = b.getAttribute('data-id'); open = open === id ? '' : id; paint();
  });

  function detail(id) {
    var m = members.filter(function (x) { return x.id === id; })[0], box = document.getElementById('det'); if (!m || !box) return;
    B.admin.get('iman/' + id).then(function (r) {
      if (document.getElementById('det') !== box) return;
      var data = (r && r.days) || {}, now = new Date(), days14 = I.lastDays(14, now), keys14 = days14.map(I.dayKey), wk = keys14.slice(7);
      var lv = I.score(data, wk, 2), sm = I.summarize(data, wk), rem = m.p.remind || {}, zy = Object.keys((r && r.zakat) || {});
      var marks = { m: '🕌', h: '🏠', l: '⏰' }, names = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
      var h = '<h2>' + esc(m.p.name || '') + '</h2><div class="kv"><span>Email</span><a href="mailto:' + esc(m.p.email) + '">' + esc(m.p.email) + '</a>' +
        (m.p.phone ? '<span>Mobile</span><a href="tel:' + esc(m.p.phone.replace(/\s/g, '')) + '">' + esc(m.p.phone) + '</a>' : '') +
        '<span>City</span>' + esc(m.p.city || '–') + '<span>Joined</span>' + (m.p.joined ? esc(new Date(m.p.joined).toLocaleDateString()) : '–') +
        '<span>Bai\u2019at</span><div>' + (m.p.bayah && m.p.bayah.taken ? 'Taken' + (m.p.bayah.with ? ' with ' + esc(m.p.bayah.with) : '') + (m.p.bayah.at ? ' (marked ' + esc(new Date(m.p.bayah.at).toLocaleDateString()) + ')' : '') +
          ' · <b>' + ({ approved: 'Approved', pending: 'Waiting for approval', rejected: 'Not approved' }[bstat(m)]) + '</b>' + (m.ok && m.ok.by ? ' <span class="muted">(' + esc(m.ok.by) + ', ' + esc(new Date(m.ok.at).toLocaleDateString()) + ')</span>' : '') +
          '<div style="margin-top:6px;display:flex;gap:8px">' + (bstat(m) !== 'approved' ? '<button class="pri" data-ok="' + esc(m.id) + '">Approve</button>' : '') + (bstat(m) !== 'rejected' ? '<button data-no="' + esc(m.id) + '">' + (bstat(m) === 'approved' ? 'Withdraw approval' : 'Not approved') + '</button>' : '') + '</div>'
          : 'Not marked') + '</div>' +
        (m.p.bayah_request && m.p.bayah_request.at ? '<span>Bai\u2019at request</span><div>Sent ' + esc(new Date(m.p.bayah_request.at).toLocaleDateString()) + ' · with ' + esc(m.p.bayah_request.with === 'Any' ? 'any' : m.p.bayah_request.with || 'any') + (m.p.bayah_request.phone ? ' · ' + esc(m.p.bayah_request.phone) : '') + (m.p.bayah_request.note ? '<br>“' + esc(m.p.bayah_request.note) + '”' : '') + (m.rq && m.rq.contacted ? ' <span class="muted">(contacted ' + esc(new Date(m.rq.at).toLocaleDateString()) + ')</span>' : '') + '</div>' : '') +
        '<span>Reminders</span><div>' + (rem.gather ? '<span class="pill">gathering emails</span>' : '') + (rem.weekly ? '<span class="pill">Friday summary</span>' : '') + (rem.push ? '<span class="pill">app notifications</span>' : '') + (!rem.gather && !rem.weekly && !rem.push ? 'none' : '') + '</div>' +
        '<span>Last 7 days</span><div><b>' + lv.score + '</b> · ' + esc(lv.label) + ' — prayer ' + Math.round(lv.parts.prayer * 100) + '%, fasting ' + Math.round(lv.parts.fast * 100) + '%, dhikr ' + Math.round(lv.parts.dhikr * 100) + '%, good deeds ' + Math.round(lv.parts.deeds * 100) + '%</div>' +
        '<span>This week</span><div>' + sm.onTime + ' on time (' + sm.masjid + ' at the masjid), ' + sm.late + ' late, ' + sm.fasts + ' fasts, ' + sm.dhikr.toLocaleString() + ' dhikr, ' + sm.deeds + ' good deeds</div>' +
        (zy.length ? '<span>Zakat paid</span><div>' + esc(zy.join(', ')) + ' AH</div>' : '') + '</div>';
      h += '<div class="scroll"><table><tr><th>Last 14 days</th>' + days14.map(function (d, i) { return '<th>' + names[d.getDay()] + '<br>' + d.getDate() + '</th>'; }).join('') + '</tr>' +
        I.PRAYERS.map(function (p) { return '<tr><td>' + p[1] + '</td>' + keys14.map(function (k) { var v = data[k] && data[k].p && data[k].p[p[0]]; return '<td>' + (v ? marks[v] : '·') + '</td>'; }).join('') + '</tr>'; }).join('') +
        '<tr><td>Fast</td>' + keys14.map(function (k) { return '<td>' + (data[k] && data[k].fast ? '🌙' : '·') + '</td>'; }).join('') + '</tr>' +
        '<tr><td>Dhikr</td>' + keys14.map(function (k) { var n = data[k] && data[k].dhikr; return '<td>' + (n ? I.fmtN(n) : '·') + '</td>'; }).join('') + '</tr>' +
        '<tr><td>Good deeds</td>' + keys14.map(function (k) { var n = data[k] && data[k].g ? Object.keys(data[k].g).length : 0; return '<td>' + (n || '·') + '</td>'; }).join('') + '</tr></table></div>' +
        '<p class="muted" style="margin:8px 0 0">🕌 on time at the masjid · 🏠 on time at home · ⏰ late or made up</p>';
      box.innerHTML = h;
    }, function () { box.textContent = 'Could not load this member\'s Iman Health.'; });
  }

  function csv() {
    var rows = [['Name', 'Email', 'Mobile', 'City', 'Joined', 'Iman Health (last 7 days)', 'Level', 'Updated', 'Gathering emails', 'Friday summary', 'App notifications', "Bai'at", "Bai'at with", 'Approval', "Bai'at request", 'Request with', 'Request mobile', 'Request message', 'Request date', 'Contacted', 'Contacted by', 'Contacted on']];
    members.forEach(function (m) {
      var r = m.p.remind || {};
      rows.push([m.p.name, m.p.email, m.p.phone, m.p.city, m.p.joined ? new Date(m.p.joined).toISOString().slice(0, 10) : '', m.s ? m.s.score : '', m.s ? m.s.label : '', m.s && m.s.updated ? new Date(m.s.updated).toISOString().slice(0, 10) : '', r.gather ? 'yes' : 'no', r.weekly ? 'yes' : 'no', r.push ? 'yes' : 'no', m.p.bayah && m.p.bayah.taken ? 'yes' : 'no', (m.p.bayah && m.p.bayah.with) || '', bstat(m)].concat((function () {
        var q = m.p.bayah_request; if (!q || !q.at) return ['no', '', '', '', '', '', '', ''];
        var c = !!(m.rq && m.rq.contacted && (m.rq.at || 0) >= q.at);
        return ['yes', q.with || '', q.phone || '', q.note || '', new Date(q.at).toISOString().slice(0, 10), c ? 'yes' : 'no', c ? m.rq.by || '' : '', c ? new Date(m.rq.at).toISOString().slice(0, 10) : ''];
      })()));
    });
    var text = rows.map(function (r) { return r.map(function (v) { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' })); a.download = 'noor-members-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  }
})();
</script>
</body>
</html>
